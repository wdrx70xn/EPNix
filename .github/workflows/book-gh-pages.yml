name: Book GitHub Pages
'on':
  workflow_dispatch: null
  push:
    branches:
    - master
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository_owner == 'wdrx70xn'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
      with:
        primary-key: build-docs-${{ hashFiles('.github/workflows/book-gh-pages.yml',
          'flake.lock') }}
        purge: true
        purge-last-accessed: 2629800
        purge-prefixes: build-docs-
        purge-primary-key: never
    - name: Build documentation books
      run: 'nix run --print-build-logs ''.#ci-scripts/build-docs-multiversion''

        '
    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
      with:
        path: ./outputs/out/book
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
